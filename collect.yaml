name: Собрать мероприятия

on:
  schedule:
    - cron: "17 4 * * *"   # каждый день в 5:17 по Варшаве (зимой)
  workflow_dispatch:         # кнопка «Run workflow» для запуска вручную
  push:                      # сразу после сохранения в админке
    paths:
      - manual.json
      - sources.json

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
      - name: Сохранить events.json
        run: |
          git config user.name "events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Обновить мероприятия" && (git push || (git pull --rebase && git push)))
